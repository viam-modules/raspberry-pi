name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build_and_lint:
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm, arm64]
    runs-on: ubuntu-4cpu-arm
    container:
      image: ghcr.io/viam-modules/raspberry-pi:${{ matrix.architecture }}
    timeout-minutes: 30

    # JavaScript actions (e.g. actions/checkout) run on the runner's 64-bit Node, which cannot
    # execute inside the 32-bit arm container, so this job only uses plain `run` steps.
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --oneline

      - name: Verify no uncommitted changes from make lint
        run: |
          chown -R testbot:testbot .
          sudo -u testbot bash -lc 'make lint'
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
              echo '"make lint" resulted in changes not in git' 1>&2
              git status
              git diff
              exit 1
          fi

      - name: make build
        run: |
          sudo -u testbot bash -lc 'make'

